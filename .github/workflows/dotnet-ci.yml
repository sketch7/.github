name: dotnet CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: "JSON-encoded runs-on value e.g. '\"ubuntu-latest\"' or '[\"blacksmith-4vcpu-ubuntu-2404\"]'."
        required: false
        type: string
        default: '"ubuntu-latest"'
      timeout-minutes:
        description: "Job timeout in minutes."
        required: false
        type: number
        default: 15
      skip-draft-pr:
        description: "Skip the job when triggered by a draft pull request."
        required: false
        type: boolean
        default: true
      dotnet-version:
        description: ".NET SDK version to use e.g. '10.0.x'."
        required: false
        type: string
        default: "10.0.x"
      solution-file:
        description: "Solution or project file to build. Auto-discovered when omitted."
        required: false
        type: string
      dotnet-cfg:
        description: "Build configuration e.g. 'Release', 'Debug'."
        required: false
        type: string
        default: "Release"
      project-path:
        description: "Path to the project or mono repo sub-folder e.g. './my-service'. Prepended to solution-file when resolving."
        required: false
        type: string
        default: "./"
      private-nuget-env-prefix:
        description: "Env var prefix for NuGet credentials (must match NuGet.Config %{PREFIX}_USERNAME% / %{PREFIX}_TOKEN%). When set, configures credentials."
        required: false
        type: string
      test-filter:
        description: "Filter expression passed to 'dotnet test --filter'. Use to exclude categories e.g. 'Category!=e2e'. Leave empty to run all tests."
        required: false
        type: string
        default: ""
    secrets:
      nuget-auth-token:
        description: "Auth token for NuGet source (also used for private NuGet restore credentials when private-nuget-env-prefix is set)."
        required: false
      private-nuget-username:
        description: "Username for private NuGet registry. Defaults to github.actor when omitted."
        required: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_AUTH_TOKEN: ${{ secrets.nuget-auth-token || secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read
  checks: write
  actions: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: inputs.skip-draft-pr != true || github.event.pull_request.draft != true
    runs-on: ${{ fromJson(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: "./Directory.Packages.props"

      - name: Configure private NuGet credentials
        if: inputs.private-nuget-env-prefix != ''
        run: |
          echo "${{ inputs.private-nuget-env-prefix }}_USERNAME=${{ secrets.private-nuget-username || github.actor }}" >> $GITHUB_ENV
          echo "${{ inputs.private-nuget-env-prefix }}_TOKEN=$NUGET_AUTH_TOKEN" >> $GITHUB_ENV

      - name: Print environment versions
        run: |
          DOTNET_V=$(dotnet --version)
          echo "::notice::dotnet version: $DOTNET_V"

      - name: Resolve solution file
        uses: sketch7/.github/.github/actions/resolve-dotnet-sln@feature/promotable-app-release-cycle
        with:
          project-path: ${{ inputs.project-path }}
          solution-file: ${{ inputs.solution-file }}

      - name: Restore dependencies
        run: dotnet restore "$SLN" /p:Configuration=${{ inputs.dotnet-cfg }}

      - name: Build
        run: dotnet build "$SLN" -c ${{ inputs.dotnet-cfg }} --no-restore

      - name: Test
        id: test
        run: |
          FILTER_ARG=""
          if [[ -n "${{ inputs.test-filter }}" ]]; then
            FILTER_ARG="--filter ${{ inputs.test-filter }}"
          fi
          dotnet test "$SLN" -c ${{ inputs.dotnet-cfg }} --no-build --logger trx --results-directory ./TestResults/ $FILTER_ARG

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && steps.test.conclusion != '' && hashFiles('**/TestResults/*.trx') != '' }}
        with:
          name: .NET Tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
          fail-on-error: true
