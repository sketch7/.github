# Tagged @release-v1 — language-agnostic, shared by node and dotnet workflows.
name: create release

# Generic, language-agnostic release workflow.
# Creates an exact git tag (e.g. v2.1.0 or v2.1.0-rc.5) and a GitHub Release with auto-generated notes.
# Stable versions also float the major tag (e.g. v2); pre-releases skip that and are marked --prerelease.
# Called by both node and dotnet publish workflows after every publish (stable and pre-release).

on:
  workflow_call:
    inputs:
      version:
        description: "Version to release e.g. '2.1.0' or '2.1.0-rc.5' for a pre-release."
        required: true
        type: string
      is-prerelease:
        description: "Whether this version is a pre-release. Skips floating major-tag update and marks the GitHub Release as pre-release."
        required: false
        type: boolean
        default: false
      tag-tmpl:
        description: "Tag template for git tags. Use `{major}` as placeholder e.g. 'v{major}' → 'v2' or '{major}.x' → '2.x'."
        required: false
        type: string
        default: "v{major}"
    outputs:
      is-latest:
        description: "Whether this release is the latest (highest major version). Always 'false' for pre-releases."
        value: ${{ jobs.create-release.outputs.is-latest }}

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      is-latest: ${{ steps.meta.outputs.is-latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve release metadata
        id: meta
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ inputs.version }}'
            const major = Number(version.split('.')[0])
            const tagTmpl = '${{ inputs.tag-tmpl }}'
            const prefix = tagTmpl.split('{major}')[0]
            const exactTag = `${prefix}${version}`
            const floatingTag = tagTmpl.replace('{major}', String(major))

            const { data: allTags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existingMajors = allTags
              .map(t => {
                const m = t.name.match(/^v?(\d+)[\.\-]/)
                return m ? Number(m[1]) : null
              })
              .filter(n => n !== null)
            const highestExistingMajor = existingMajors.length > 0 ? Math.max(...existingMajors) : major
            // pre-releases never float the major tag or become "latest"
            const isLatest = '${{ inputs.is-prerelease }}' !== 'true' && major >= highestExistingMajor

            core.setOutput('exact-tag', exactTag)
            core.setOutput('floating-tag', floatingTag)
            core.setOutput('is-latest', isLatest)
            core.notice(`exactTag: ${exactTag}, floatingTag: ${floatingTag}, isLatest: ${isLatest}`)

      - name: Push version tag
        run: |
          git tag ${{ steps.meta.outputs.exact-tag }}
          git push origin ${{ steps.meta.outputs.exact-tag }}

      - name: Update floating tag
        if: inputs.is-prerelease != true
        run: |
          git tag -f ${{ steps.meta.outputs.floating-tag }}
          git push origin -f refs/tags/${{ steps.meta.outputs.floating-tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--no-latest"
          [[ "${{ steps.meta.outputs.is-latest }}" == "true" ]] && FLAGS="--latest"
          [[ "${{ inputs.is-prerelease }}" == "true" ]] && FLAGS="--prerelease"
          gh release create "${{ steps.meta.outputs.exact-tag }}" --generate-notes $FLAGS
