# Tagged @release-v1 — language-agnostic, shared by node and dotnet workflows.
name: create release

# Generic, language-agnostic release workflow.
# Creates an exact git tag (e.g. v2.1.0 or v2.1.0-rc.5) and a GitHub Release with auto-generated notes.
# Stable versions also float the major tag (e.g. v2); pre-releases skip that and are marked --prerelease.
# Called by both node and dotnet publish workflows after every publish (stable and pre-release).

on:
  workflow_call:
    inputs:
      version:
        description: "Version to release e.g. '2.1.0' or '2.1.0-rc.5' for a pre-release."
        required: true
        type: string
      is-prerelease:
        description: "Whether this version is a pre-release. Skips floating major-tag update and marks the GitHub Release as pre-release."
        required: false
        type: boolean
        default: false
      tag-tmpl:
        description: "Tag template for git tags. Use `{major}` as placeholder e.g. 'v{major}' → 'v2' or '{major}.x' → '2.x'."
        required: false
        type: string
        default: "v{major}"
    outputs:
      is-latest:
        description: "Whether this release is the latest (highest major version). Always 'false' for pre-releases."
        value: ${{ jobs.create-release.outputs.is-latest }}

permissions:
  contents: write

concurrency:
  group: create-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      is-latest: ${{ steps.guard.outputs.is-latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve release metadata
        id: meta
        uses: actions/github-script@v9
        env:
          VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.is-prerelease }}
          TAG_TMPL: ${{ inputs.tag-tmpl }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          script: |
            const fail = message => {
              core.setFailed(message)
            }
            const version = process.env.VERSION
            const isPrereleaseInput = process.env.IS_PRERELEASE
            const tagTmpl = process.env.TAG_TMPL
            const expectedSha = process.env.EXPECTED_SHA
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/
            const semverMatch = version?.match(semver)
            if (!semverMatch) {
              return fail(`version must be canonical SemVer: ${version}`)
            }
            if (!['true', 'false'].includes(isPrereleaseInput)) {
              return fail(`is-prerelease must resolve to true or false: ${isPrereleaseInput}`)
            }
            if (!/^[0-9a-f]{40,64}$/i.test(expectedSha ?? '')) {
              return fail(`github.sha must be a Git object SHA: ${expectedSha}`)
            }

            const isPrerelease = isPrereleaseInput === 'true'
            const hasPrerelease = semverMatch[4] !== undefined
            if (hasPrerelease !== isPrerelease) {
              return fail(`version prerelease state (${hasPrerelease}) must match is-prerelease (${isPrerelease})`)
            }

            const major = semverMatch[1]
            const marker = '{major}'
            const markerIndex = tagTmpl?.indexOf(marker) ?? -1
            if (markerIndex === -1 || tagTmpl.indexOf(marker, markerIndex + marker.length) !== -1) {
              return fail('tag-tmpl must contain exactly one {major} marker')
            }

            const prefix = tagTmpl.slice(0, markerIndex)
            const suffix = tagTmpl.slice(markerIndex + marker.length)
            const exactTag = `${prefix}${version}${suffix}`
            const floatingTag = `${prefix}${major}${suffix}`
            const isValidTagRef = tag => {
              if (!tag || tag.startsWith('-') || tag.startsWith('/') || tag.endsWith('/') || tag.endsWith('.') || tag.includes('//') || tag.includes('..') || tag.includes('@{')) {
                return false
              }
              if (/[\x00-\x20\x7f ~^:?*\[\\]/.test(tag)) {
                return false
              }
              return tag.split('/').every(part => part !== '' && part !== '.' && part !== '..' && !part.endsWith('.lock'))
            }
            if (!isValidTagRef(exactTag) || !isValidTagRef(floatingTag)) {
              return fail(`tag-tmpl produces an invalid Git tag ref: ${tagTmpl}`)
            }

            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const stableTag = new RegExp(`^${escapeRegex(prefix)}(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)${escapeRegex(suffix)}$`)
            const allTags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const stableVersions = allTags
              .map(t => {
                const match = t.name.match(stableTag)
                return match ? { major: match[1], minor: match[2], patch: match[3] } : null
              })
              .filter(version => version !== null)
            const compareDecimal = (left, right) => {
              if (left.length !== right.length) return left.length - right.length
              for (let index = 0; index < left.length; index += 1) {
                if (left[index] !== right[index]) return left.charCodeAt(index) - right.charCodeAt(index)
              }
              return 0
            }
            const compareStableVersion = (left, right) => {
              for (const component of ['major', 'minor', 'patch']) {
                const comparison = compareDecimal(left[component], right[component])
                if (comparison !== 0) return comparison
              }
              return 0
            }
            const highestExistingMajor = stableVersions.reduce(
              (highest, candidate) => compareDecimal(candidate.major, highest) > 0 ? candidate.major : highest,
              major,
            )
            const currentStableVersion = {
              major,
              minor: semverMatch[2],
              patch: semverMatch[3],
            }
            const hasHigherStableInMajor = stableVersions.some(candidate => (
              compareDecimal(candidate.major, major) === 0
              && compareStableVersion(candidate, currentStableVersion) > 0
            ))
            // Pre-releases never mutate stable channels or become "latest". Only stable exact tags participate.
            const isLatestMajor = !isPrerelease && compareDecimal(major, highestExistingMajor) >= 0
            const isHighestInMajor = !isPrerelease && !hasHigherStableInMajor

            let exactTagExists = false
            let exactTagMatches = false
            let ref
            try {
              ({ data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${exactTag}`,
              }))
              exactTagExists = true
            } catch (error) {
              if (error.status !== 404) {
                return fail(`unable to resolve exact tag ${exactTag}: ${error.message}`)
              }
            }

            if (exactTagExists) {
              if (!ref?.object || typeof ref.object.sha !== 'string' || typeof ref.object.type !== 'string') {
                return fail(`exact tag ${exactTag} returned an unexpected Git ref object`)
              }
              let object = ref.object
              const peeledTags = new Set()
              while (object.type === 'tag') {
                if (peeledTags.has(object.sha)) {
                  return fail(`annotated tag ${exactTag} contains a tag-object cycle`)
                }
                peeledTags.add(object.sha)
                try {
                  const { data: tag } = await github.rest.git.getTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag_sha: object.sha,
                  })
                  if (!tag?.object || typeof tag.object.sha !== 'string' || typeof tag.object.type !== 'string') {
                    return fail(`annotated tag ${exactTag} returned an unexpected Git object`)
                  }
                  object = tag.object
                } catch (error) {
                  return fail(`unable to peel annotated tag ${exactTag}: ${error.message}`)
                }
              }
              if (object.type !== 'commit') {
                return fail(`exact tag ${exactTag} must resolve to a commit, got ${object.type}`)
              }
              exactTagMatches = object.sha.toLowerCase() === expectedSha.toLowerCase()
              if (!exactTagMatches) {
                return fail(`exact tag ${exactTag} already points to ${object.sha}, not ${expectedSha}`)
              }
            }

            core.setOutput('exact-tag', exactTag)
            core.setOutput('floating-tag', floatingTag)
            core.setOutput('is-latest-major', isLatestMajor)
            core.setOutput('is-highest-in-major', isHighestInMajor)
            core.setOutput('is-prerelease', isPrerelease)
            core.setOutput('exact-tag-exists', exactTagExists)
            core.setOutput('exact-tag-matches', exactTagMatches)
            core.notice(`exactTag: ${exactTag}, floatingTag: ${floatingTag}, isLatestMajor: ${isLatestMajor}, isHighestInMajor: ${isHighestInMajor}, exactTagExists: ${exactTagExists}`)

      - name: Inspect existing GitHub Release
        id: release
        uses: actions/github-script@v9
        env:
          EXACT_TAG: ${{ steps.meta.outputs.exact-tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is-prerelease }}
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.EXACT_TAG,
              })
              if (data.draft === true) {
                return core.setFailed(`Release ${process.env.EXACT_TAG} is still a draft`)
              }
              if (data.prerelease !== (process.env.IS_PRERELEASE === "true")) {
                return core.setFailed(`Release ${process.env.EXACT_TAG} has the wrong prerelease state`)
              }
              core.setOutput("release-exists", "true")
            } catch (error) {
              if (error.status !== 404) throw error
              core.setOutput("release-exists", "false")
            }

      - name: Push version tag
        if: steps.meta.outputs.exact-tag-exists != 'true'
        env:
          EXACT_TAG: ${{ steps.meta.outputs.exact-tag }}
        run: |
          git check-ref-format "refs/tags/${EXACT_TAG}"
          git tag -- "${EXACT_TAG}"
          git push origin "refs/tags/${EXACT_TAG}"

      - name: Create GitHub Release
        if: steps.release.outputs.release-exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_TAG: ${{ steps.meta.outputs.exact-tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is-prerelease }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest=false)
          fi
          gh release create "${flags[@]}" -- "${EXACT_TAG}"

      - name: Verify branch head and mutation eligibility
        id: guard
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is-prerelease }}
          IS_LATEST_MAJOR: ${{ steps.meta.outputs.is-latest-major }}
          IS_HIGHEST_IN_MAJOR: ${{ steps.meta.outputs.is-highest-in-major }}
        with:
          script: |
            const fail = message => {
              core.setFailed(message)
            }
            const expectedSha = process.env.EXPECTED_SHA
            const triggerRef = process.env.TRIGGER_REF
            const isPrerelease = process.env.IS_PRERELEASE === 'true'
            const isLatestMajor = process.env.IS_LATEST_MAJOR === 'true'
            const isHighestInMajor = process.env.IS_HIGHEST_IN_MAJOR === 'true'
            if (isPrerelease) {
              core.setOutput('branch-matches', false)
              core.setOutput('mutation-eligible', false)
              core.setOutput('is-latest', false)
              return core.notice('pre-release skips stable-channel mutations')
            }
            if (!triggerRef?.startsWith('refs/heads/')) {
              return fail(`release mutations require a branch ref, got ${triggerRef}`)
            }

            let ref
            try {
              ({ data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: triggerRef.slice('refs/'.length),
              }))
            } catch (error) {
              return fail(`unable to re-read triggering branch ${triggerRef}: ${error.message}`)
            }
            if (!ref?.object || ref.object.type !== 'commit' || typeof ref.object.sha !== 'string') {
              return fail(`triggering branch ${triggerRef} returned an unexpected Git ref object`)
            }

            const branchMatches = ref.object.sha.toLowerCase() === expectedSha.toLowerCase()
            const mutationEligible = !isPrerelease && isHighestInMajor && branchMatches
            const isLatest = mutationEligible && isLatestMajor
            core.setOutput('branch-matches', branchMatches)
            core.setOutput('mutation-eligible', mutationEligible)
            core.setOutput('is-latest', isLatest)
            core.notice(`branchMatches: ${branchMatches}, mutationEligible: ${mutationEligible}, isLatest: ${isLatest}`)

      - name: Mark GitHub Release as latest
        if: steps.guard.outputs.is-latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_TAG: ${{ steps.meta.outputs.exact-tag }}
        run: gh release edit --latest -- "${EXACT_TAG}"

      - name: Update floating tag
        if: steps.guard.outputs.mutation-eligible == 'true'
        env:
          FLOATING_TAG: ${{ steps.meta.outputs.floating-tag }}
        run: |
          git check-ref-format "refs/tags/${FLOATING_TAG}"
          git tag -f -- "${FLOATING_TAG}"
          git push origin -f "refs/tags/${FLOATING_TAG}"
