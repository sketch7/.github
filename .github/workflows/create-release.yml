# Breaking release-v2 contract: one version input; prerelease state comes from that version.
name: create release

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON-encoded runner label or array.
        type: string
        default: '"ubuntu-latest"'
      timeout-minutes:
        type: number
        default: 15
      version:
        description: Published canonical SemVer, without a v prefix or build metadata.
        type: string
        required: true
    outputs:
      update-channels:
        description: Whether callers may update Docker channels and deploy this release; still check branch freshness.
        value: ${{ jobs.create-release.outputs.update-channels }}
      is-latest:
        description: Whether this is the current highest stable release.
        value: ${{ jobs.create-release.outputs.is-latest }}

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      update-channels: ${{ steps.release.outputs.update-channels }}
      is-latest: ${{ steps.release.outputs.is-latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The caller serializes the entire publish/finalize/channel flow per repository.
      # This finalizes the supplied artifact version; it never allocates another version.
      - name: Finalize exact release
        id: release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            const version = process.env.VERSION
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$/.exec(version ?? '')
            if (!match) throw new Error('version must be canonical SemVer without build metadata')
            const tag = `v${version}`
            const prerelease = match[4] !== undefined
            const repo = context.repo
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
            const optional = async request => {
              try { return (await request()).data }
              catch (error) { if (error.status !== 404) throw error }
            }
            core.setOutput('is-latest', false)
            core.setOutput('update-channels', false)

            // Native Git peels annotated tags, including tags of tags.
            const tags = git('tag', '--list').split('\n')
            const exists = tags.includes(tag)
            if (exists && git('rev-parse', `refs/tags/${tag}^{commit}`) !== context.sha)
              throw new Error(`Exact tag ${tag} belongs to another commit`)
            let release = await optional(() => github.rest.repos.getReleaseByTag({ ...repo, tag }))
            if (release && (!exists || release.tag_name !== tag || release.draft !== false || release.prerelease !== prerelease))
              throw new Error(`Release ${tag} conflicts with the published artifact`)
            if (!exists)
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha: context.sha })
            if (!release)
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, name: tag, prerelease,
                generate_release_notes: true, make_latest: 'false',
              })).data

            if (prerelease) {
              core.setOutput('update-channels', true)
              return
            }
            if (!context.ref.startsWith('refs/heads/')) return
            const branch = (await github.rest.git.getRef({ ...repo, ref: context.ref.slice(5) })).data
            if (branch.object.sha !== context.sha) {
              core.notice('Branch advanced: exact release retained; channels and main bump skipped')
              return
            }

            // Paginate and compare arbitrary-size integers; prereleases cannot take latest.
            const allTags = await github.paginate(github.rest.repos.listTags, { ...repo, per_page: 100 })
            const current = match.slice(1, 4).map(BigInt)
            const stable = allTags.flatMap(({ name }) => {
              const parsed = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(name)
              return parsed ? [parsed.slice(1).map(BigInt)] : []
            })
            const greater = candidate => {
              for (let i = 0; i < 3; i++) {
                if (candidate[i] !== current[i]) return candidate[i] > current[i]
              }
              return false
            }
            if (stable.some(candidate => candidate[0] === current[0] && greater(candidate))) return
            const latest = !stable.some(greater)
            const ref = `tags/v${match[1]}`
            const floating = await optional(() => github.rest.git.getRef({ ...repo, ref }))
            if (floating)
              await github.rest.git.updateRef({ ...repo, ref, sha: context.sha, force: true })
            else
              await github.rest.git.createRef({ ...repo, ref: `refs/${ref}`, sha: context.sha })
            if (latest)
              await github.rest.repos.updateRelease({ ...repo, release_id: release.id, make_latest: 'true' })
            core.setOutput('is-latest', latest)
            core.setOutput('update-channels', true)
