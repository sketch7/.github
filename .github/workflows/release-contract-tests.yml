name: Release contract tests

on:
  pull_request:
    paths: [".github/workflows/**", "test/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test test/*.test.mjs
