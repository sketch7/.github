# Automatically moves floating tags (see .github/tag-map.yml) when the files they cover change
# on main. Also supports manual multi-tag updates via workflow_dispatch. Reusable via
# workflow_call so other repos (e.g. arcane.hexgate) can run the same tag-moving logic against
# their own .github/tag-map.yml — the default checkout resolves to the calling repo.
name: update tags

on:
  push:
    branches: [main]
    paths: [".github/workflows/*.yml"]
  workflow_dispatch:
    inputs:
      node-libs-v3:
        description: "node-libs-v3"
        type: boolean
        default: false
      dotnet-libs-v3:
        description: "dotnet-libs-v3"
        type: boolean
        default: false
      release-v2:
        description: "release-v2"
        type: boolean
        default: false
      ci-tags-v1:
        description: "ci-tags-v1"
        type: boolean
        default: false
  workflow_call: {}

permissions:
  contents: write

jobs:
  update-tags:
    name: Update Tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Convert tag map to JSON
        run: yq -o=json '.' .github/tag-map.yml > /tmp/tag-map.json

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'push'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD | tr '\n' ',')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Resolve tags to update
        id: resolve-tags
        uses: actions/github-script@v9
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        with:
          script: |
            const fs = require('fs')
            const tagMap = JSON.parse(fs.readFileSync('/tmp/tag-map.json', 'utf8'))

            let tags = []

            if (context.eventName === 'push') {
              const changedFiles = process.env.CHANGED_FILES.split(',').map(f => f.trim()).filter(Boolean)
              core.info(`Changed files: ${changedFiles.join(', ')}`)
              for (const [tag, paths] of Object.entries(tagMap)) {
                const matches = paths.some(p =>
                  p.endsWith('/**')
                    ? changedFiles.some(f => f.startsWith(p.slice(0, -3)))
                    : changedFiles.includes(p)
                )
                if (matches) tags.push(tag)
              }
            } else {
              tags = Object.keys(tagMap).filter(tag => context.payload.inputs?.[tag] === 'true')
            }

            core.info(tags.length ? `Tags to update: ${tags.join(', ')}` : 'No tags to update')
            core.setOutput('tags', tags.join(','))
            core.setOutput('has-updates', tags.length > 0 ? 'true' : 'false')

      - name: Update tags
        id: update-tags
        if: steps.resolve-tags.outputs.has-updates == 'true'
        env:
          TAGS: ${{ steps.resolve-tags.outputs.tags }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for tag in "${TAG_LIST[@]}"; do
            echo "Moving tag: $tag → $(git rev-parse --short HEAD)"
            git tag -f "$tag"
            git push origin "$tag" --force
          done

      - name: No updates
        if: steps.resolve-tags.outputs.has-updates != 'true'
        run: echo "No files changed that map to a tag — nothing to update."

      - name: Write summary
        if: always()
        uses: actions/github-script@v9
        env:
          TAGS: ${{ steps.resolve-tags.outputs.tags }}
          HAS_UPDATES: ${{ steps.resolve-tags.outputs.has-updates }}
          UPDATE_OUTCOME: ${{ steps.update-tags.outcome }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const tags = process.env.TAGS ? process.env.TAGS.split(',').filter(Boolean) : []
            const hasUpdates = process.env.HAS_UPDATES === 'true'
            const outcome = process.env.UPDATE_OUTCOME  // 'success', 'failure', 'skipped'
            const isDispatch = context.eventName === 'workflow_dispatch'
            const ref = context.ref.replace('refs/heads/', '')
            const sha = process.env.COMMIT_SHA.slice(0, 7)
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`

            const meta = [
              `<strong>Trigger:</strong> ${isDispatch ? 'manual dispatch' : `push to <code>${ref}</code>`}`,
              `<strong>Commit:</strong> <a href="${repoUrl}/commit/${process.env.COMMIT_SHA}"><code>${sha}</code></a>`,
            ]
            if (!isDispatch && process.env.CHANGED_FILES) {
              const files = process.env.CHANGED_FILES.split(',').map(f => f.trim()).filter(Boolean)
              if (files.length) meta.push(`<strong>Changed files:</strong> ${files.map(f => `<code>${f}</code>`).join(', ')}`)
            }

            await core.summary.addHeading('Tag Update Summary', 2).addList(meta)

            if (!hasUpdates) {
              await core.summary.addRaw('ℹ️ No files changed that map to a tag — nothing to update.\n').write()
              return
            }

            const statusIcon = outcome === 'success' ? '✅' : outcome === 'failure' ? '❌' : '⏭️'
            const statusText = outcome === 'success' ? 'Updated' : outcome === 'failure' ? 'Failed' : 'Skipped'
            await core.summary
              .addTable([
                [{ data: 'Tag', header: true }, { data: 'Commit', header: true }, { data: 'Status', header: true }],
                ...tags.map(tag => [
                  { data: `<code>${tag}</code>`, header: false },
                  { data: `<a href="${repoUrl}/commit/${process.env.COMMIT_SHA}"><code>${sha}</code></a>`, header: false },
                  { data: `${statusIcon} ${statusText}`, header: false },
                ]),
              ])
              .write()
